<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">AAAlab logo</title>
  <desc id="desc">A green three-leaf clover with a white letter A on each leaf.</desc>
  <defs>
    <linearGradient id="leafGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#45b74a"/>
      <stop offset="1" stop-color="#238b38"/>
    </linearGradient>
    <linearGradient id="stemGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4dbc51"/>
      <stop offset="1" stop-color="#16823a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0b5d29" flood-opacity="0.18"/>
    </filter>
    <path id="heartLeaf" d="M 0 56 C -55 -22 -154 -6 -178 88 C -202 184 -100 261 0 340 C 100 261 202 184 178 88 C 154 -6 55 -22 0 56 Z"/>
  </defs>

  <rect width="1024" height="1024" fill="#fff"/>

  <g filter="url(#softShadow)" stroke="#087f36" stroke-width="28" stroke-linejoin="round">
    <use href="#heartLeaf" transform="translate(512 170) scale(1.05)" fill="url(#leafGradient)"/>
    <use href="#heartLeaf" transform="translate(365 448) rotate(55) scale(1.05)" fill="url(#leafGradient)"/>
    <use href="#heartLeaf" transform="translate(659 448) rotate(-55) scale(1.05)" fill="url(#leafGradient)"/>

    <path d="M 512 520 C 515 640 523 735 461 858 C 451 878 461 901 483 909 C 505 918 529 907 538 886 C 611 718 575 613 545 522 Z" fill="url(#stemGradient)"/>
  </g>

  <g fill="#fff" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <text x="512" y="360" font-size="185">A</text>
    <text x="325" y="622" font-size="185" transform="rotate(-2 325 622)">A</text>
    <text x="699" y="622" font-size="185" transform="rotate(2 699 622)">A</text>
  </g>
</svg>
