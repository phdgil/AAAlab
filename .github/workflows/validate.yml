name: Validate Harnesses

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate all harnesses with npm
        run: npm test

      - name: Validate all harnesses with PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\validate-all.ps1
