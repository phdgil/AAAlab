name: Validate Harnesses

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate all harnesses with npm
        run: npm test

      - name: Setup Python for slide audit tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install slide audit dependencies
        run: python -m pip install -r harnesses/classroom-slide-design-harness/skills/classroom-slide-design-harness/scripts/requirements.txt

      - name: Test classroom slide audit behavior
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python harnesses/classroom-slide-design-harness/skills/classroom-slide-design-harness/scripts/test_audit_pptx.py

      - name: Test OpenMRA provenance and resume behavior without GUI
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s harnesses/openmra-harness/skills/openmra-harness/scripts -p "test_*.py"

      - name: Validate all harnesses with PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\validate-all.ps1
