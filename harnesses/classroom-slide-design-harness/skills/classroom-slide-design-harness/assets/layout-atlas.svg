<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Message before theme: classroom slide layout ideas</title>
<desc id="desc">Six original schematic examples: question, comparison, mechanism, evidence, work map and start signal. No real lesson data or measurements.</desc>
<rect width="1200" height="800" fill="#eef0f4"/>
<g font-family="Arial,sans-serif">
<text x="30" y="44" font-size="29" font-weight="bold" fill="#102A43">MESSAGE BEFORE THEME</text>
<text x="30" y="76" font-size="18" fill="#34475b">Change the visual form and color emphasis—not just the text. Schematics, not fixed templates.</text>
<g transform="translate(30 110)">
<rect width="550" height="200" rx="10" fill="#102A43"/>
<text x="24" y="37" font-size="16" fill="#F2B134">QUESTION / CONTRAST</text>
<text x="24" y="83" font-size="30" fill="white" font-weight="bold">What changes together?</text>
<rect x="30" y="117" width="135" height="49" rx="7" fill="#6542B5"/><text x="73" y="149" font-size="22" fill="white">INPUT</text>
<text x="184" y="150" font-size="29" fill="#F2B134">+</text>
<rect x="220" y="117" width="135" height="49" rx="7" fill="#C94F5B"/><text x="263" y="149" font-size="22" fill="white">INPUT</text>
<text x="397" y="157" font-size="62" fill="#F2B134">?</text>
</g>
<g transform="translate(610 110)">
<rect width="560" height="200" rx="10" fill="#F1EDFA"/>
<rect width="130" height="200" rx="10" fill="#6542B5"/>
<text x="16" y="85" font-size="24" fill="white" font-weight="bold">Which</text><text x="16" y="118" font-size="24" fill="white" font-weight="bold">tool?</text>
<rect x="150" y="25" width="105" height="44" fill="#1768AC"/><rect x="255" y="25" width="278" height="44" fill="white"/>
<rect x="150" y="79" width="105" height="44" fill="#087F8C"/><rect x="255" y="79" width="278" height="44" fill="white"/>
<rect x="150" y="133" width="105" height="44" fill="#935A00"/><rect x="255" y="133" width="278" height="44" fill="white"/>
<g font-size="18"><text x="169" y="54" fill="white">TOOL A</text><text x="169" y="108" fill="white">TOOL B</text><text x="169" y="162" fill="white">TOOL C</text><text x="274" y="54" fill="#102A43">One short job description</text><text x="274" y="108" fill="#102A43">One short job description</text><text x="274" y="162" fill="#102A43">One short job description</text></g>
</g>
<g transform="translate(30 330)">
<rect width="550" height="200" rx="10" fill="#E7F5F3"/>
<text x="24" y="39" font-size="26" font-weight="bold" fill="#087F8C">SHOW THE PROCESS</text>
<rect x="26" y="92" width="143" height="65" rx="8" fill="white"/><text x="49" y="131" font-size="21" fill="#102A43">BEFORE</text>
<path d="M190 117H325V104L356 126L325 148V135H190Z" fill="#F2B134"/>
<text x="200" y="87" font-size="19" fill="#102A43">process label</text>
<rect x="377" y="92" width="143" height="65" rx="8" fill="#087F8C"/><text x="415" y="131" font-size="21" fill="white">AFTER</text>
</g>
<g transform="translate(610 330)">
<rect width="560" height="200" rx="10" fill="#241F32"/>
<rect x="22" y="20" width="335" height="158" rx="10" fill="white"/>
<text x="42" y="52" font-size="18" fill="#102A43">REAL EVIDENCE + SOURCE</text>
<text x="42" y="112" font-size="44" font-weight="bold" fill="#C94F5B">VALUE</text><text x="215" y="111" font-size="24" fill="#102A43">+ unit</text>
<text x="42" y="154" font-size="16" fill="#60717D">endpoint / system / source link</text>
<text x="384" y="67" font-size="25" font-weight="bold" fill="#F2B134">READ</text><text x="384" y="108" font-size="25" font-weight="bold" fill="#F2B134">CHECK</text><text x="384" y="149" font-size="25" font-weight="bold" fill="#F2B134">SAVE</text>
</g>
<g transform="translate(30 550)">
<rect width="550" height="200" rx="10" fill="#A93F4A"/>
<text x="24" y="38" font-size="25" fill="white" font-weight="bold">SHARE THE WORK</text>
<g stroke="#F2B134" stroke-width="4"><path d="M92 88L210 126M92 168L210 140M460 88L340 126M460 168L340 140"/></g>
<rect x="194" y="95" width="164" height="78" rx="8" fill="white"/><text x="217" y="126" font-size="19" fill="#102A43">ONE SHARED</text><text x="240" y="154" font-size="19" fill="#102A43">RESULT</text>
<g fill="#F2B134"><circle cx="75" cy="83" r="24"/><circle cx="75" cy="164" r="24"/><circle cx="477" cy="83" r="24"/><circle cx="477" cy="164" r="24"/></g>
<g font-size="21" fill="#102A43"><text x="68" y="91">A</text><text x="68" y="172">B</text><text x="470" y="91">C</text><text x="470" y="172">D</text></g>
</g>
<g transform="translate(610 550)">
<rect width="560" height="200" rx="10" fill="#F2B134"/>
<text x="24" y="38" font-size="16" fill="#102A43">LECTURE ENDS / PROJECT BEGINS</text>
<text x="24" y="100" font-size="47" font-weight="bold" fill="#102A43">START NOW</text>
<rect x="24" y="125" width="510" height="49" rx="7" fill="#102A43"/><text x="60" y="157" font-size="23" font-weight="bold" fill="white">OPEN → SEARCH → SAVE</text>
</g>
<text x="30" y="781" font-size="16" fill="#34475b">Keep labels readable. Color supports meaning; it never replaces words, symbols or evidence.</text>
</g>
</svg>
